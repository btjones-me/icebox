<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icebox nesting comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #e9ecea; color: #163248; font: 600 14px/1.4 system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1440px; margin: 0 auto; }
      figure { margin: 0; padding: 16px; border: 1px solid #d2d7d4; border-radius: 12px; background: white; }
      figcaption { margin-bottom: 12px; }
      img { display: block; width: 100%; height: 900px; object-fit: contain; object-position: top center; background: white; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>Source annotation</figcaption><img src="source-nesting.png" alt="Source screenshot" /></figure>
      <figure><figcaption>Browser-rendered implementation</figcaption><img src="implementation-nesting-stage.png" alt="Implementation screenshot" /></figure>
    </main>
  </body>
</html>
